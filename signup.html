<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup page</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script> 
</head>
<body>
    <div id="login">
        <div class="logo">
            <img src="logo.png" alt="Bus Logo" class="bus-image">
        </div>
    <h1>SignUp</h1>
    <form action="" method="post">
        <label for="username">First Name</label>
        <input type="text" id="username" name="fName" placeholder="Enter your Firstname">
        <label for="username">last Name</label>
        <input type="text" id="username" name="lName" placeholder="Enter your lastname">
        <label for="email">Email</label>
        <input type="text" id="email" name="email" placeholder="Enter your Email">
        
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">
        <br>
        <button type="submit">SignUp</button>
       
    </form>
    <p>Have an account <a class="hover" href="index.html">Login</a></p>
</div> 
</body>
</html>
