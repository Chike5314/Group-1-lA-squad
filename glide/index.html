</head>
<body>
    <div id="login">
    <div id="iconview">
        <h1>GLIDEBOOK</h1>
    </div>

        <div id="user">
            <label for="Username">Username</label>
            <input type="Username" required>
        </div>
        <div id="password">
            <label for="password">Password</label>
            <input type="password" required>
        </div>
        
       <div>
        <input type="Submit" value="login">
       </div>
    </form>
    <p>Don't have an account <a hef="/signup">SignUp</a></p>
    <p><a hef="/forget-password">Forget Password</a></p>
</div> 
</body>
</html>
